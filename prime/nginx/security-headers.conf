# Security headers for every response, included at server level and again
# in each location that adds its own headers (nginx drops inherited
# add_header lines in any block that sets one). See nginx.conf.template for
# what each one is for.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'sha256-3Z8AaOvmmqasb6QB3388DSjiGUeRpW1JXLiUMl7Kq3g='; style-src 'self' 'unsafe-inline' fonts.googleapis.com; font-src 'self' fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'none'; object-src 'none'; form-action 'self'" always;
add_header X-Frame-Options DENY always;
add_header X-Content-Type-Options nosniff always;
add_header Referrer-Policy strict-origin-when-cross-origin always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
