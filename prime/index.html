<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Vantage</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&display=swap"
      rel="stylesheet"
    />
    <script>
      // Apply theme before React mounts to avoid a light-mode flash on first
      // paint. Mirrors the default logic in App.tsx (dark unless the user has
      // explicitly chosen light).
      (function () {
        var t = localStorage.getItem('vantage-theme');
        if (t !== 'light') document.documentElement.classList.add('dark');
      })();
    </script>
  </head>
  <body class="bg-background text-foreground">
    <div id="app"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
