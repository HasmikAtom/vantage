name: vantage-dev

services:
  gate:
    build:
      context: ./gate
      dockerfile: Dockerfile.dev
      args:
        VANTAGE_VERSION: ${VANTAGE_VERSION:-dev}
    image: vantage-gate:dev
    container_name: vantage-gate-dev
    working_dir: /app
    environment:
      PORT: 3000
      GATE_DB_PATH: /data/auth.db
      GATE_BASE_PATH: /auth
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?BETTER_AUTH_SECRET must be set}
      # AES-256-GCM key for encrypting outpost tokens in the server registry.
      # Generate once with `openssl rand -base64 32` and persist.
      VANTAGE_REGISTRY_KEY: ${VANTAGE_REGISTRY_KEY:?VANTAGE_REGISTRY_KEY must be set (openssl rand -base64 32)}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:-http://${VANTAGE_HOSTNAME:-localhost}:${VANTAGE_DEV_PRIME_PORT:-5173}}
      TRUSTED_ORIGINS: ${TRUSTED_ORIGINS:-http://localhost:${VANTAGE_DEV_PRIME_PORT:-5173},http://${VANTAGE_HOSTNAME:-localhost}:${VANTAGE_DEV_PRIME_PORT:-5173},http://${VANTAGE_LAN_IP:-127.0.0.1}:${VANTAGE_DEV_PRIME_PORT:-5173},http://localhost:${VANTAGE_PROD_PORT:-8088}}
      GATE_RP_ID:     ${GATE_RP_ID:-${VANTAGE_HOSTNAME:-localhost}}
      GATE_RP_NAME:   ${GATE_RP_NAME:-Vantage (dev)}
      GITHUB_CLIENT_ID:     ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
      GOOGLE_CLIENT_ID:     ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      # Dev outposts live on Docker's private network, and gate re-checks an
      # outpost's address on every lookup, so private ranges must be allowed
      # here (same default as docker-compose.prime.yml / prod.yml).
      GATE_SSRF_ALLOW_PRIVATE: ${GATE_SSRF_ALLOW_PRIVATE:-1}
      # Own session cookie name: cookies ignore the port, so on a host that
      # also runs the main stack, a shared name would log you out of one
      # every time you sign in to the other.
      GATE_COOKIE_PREFIX: ${GATE_DEV_COOKIE_PREFIX:-vantage-dev}
    volumes:
      - ./gate:/app
      - vantage-dev-gate-modules:/app/node_modules
      - vantage-dev-gate-data:/data
    ports:
      - "${VANTAGE_DEV_GATE_PORT:-3000}:3000"
    networks:
      - vantage-dev

  outpost:
    build:
      context: ./outpost
      dockerfile: Dockerfile.dev
      args:
        VANTAGE_VERSION: ${VANTAGE_VERSION:-dev}
    image: vantage-outpost:dev
    container_name: vantage-outpost-dev
    working_dir: /app
    cap_add:
      - SYS_RAWIO
      - SYS_ADMIN
      - SYS_PTRACE
    security_opt:
      - apparmor=unconfined
    device_cgroup_rules:
      - 'b 8:* rwm'
      - 'b 259:* rwm'
    environment:
      HOST_PROC: /host/proc
      HOST_SYS:  /host/sys
      HOST_ETC:  /host/etc
      HOST_ROOT: /hostfs
      DBUS_SYSTEM_BUS_ADDRESS: unix:path=/run/dbus/system_bus_socket
      DOCKER_SOCK: /var/run/docker.sock
      VANTAGE_DATA_DIR: /data
      VANTAGE_ENCRYPTION_KEY: ${VANTAGE_ENCRYPTION_KEY:-}
      # The outpost refuses to start without it; gate sends the token saved
      # when the server was registered.
      VANTAGE_OUTPOST_TOKEN: ${VANTAGE_OUTPOST_TOKEN:?VANTAGE_OUTPOST_TOKEN must be set}
      CLOUDFLARE_API_TOKEN: ${CLOUDFLARE_API_TOKEN:-}
      CLOUDFLARE_ACCOUNT_ID: ${CLOUDFLARE_ACCOUNT_ID:-}
      CLOUDFLARE_TUNNEL_ID: ${CLOUDFLARE_TUNNEL_ID:-}
    volumes:
      - ./outpost:/app
      - vantage-dev-outpost-data:/data
      - vantage-dev-go-mod:/go/pkg/mod
      - vantage-dev-go-cache:/root/.cache/go-build
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /etc/os-release:/host/etc/os-release:ro
      - /etc/localtime:/etc/localtime:ro
      - /etc/hostname:/host/etc/hostname:ro
      - /etc/machine-id:/host/etc/machine-id:ro
      - /etc/passwd:/host/etc/passwd:ro
      - /etc/group:/host/etc/group:ro
      - /var/run/docker.sock:/var/run/docker.sock
      - /run/dbus/system_bus_socket:/run/dbus/system_bus_socket
      - /run/systemd:/run/systemd:ro
      - /:/hostfs:ro,rslave
      - /dev:/dev
    ports:
      - "${VANTAGE_DEV_OUTPOST_PORT:-8082}:8080"
    networks:
      - vantage-dev

  prime:
    build:
      context: ./prime
      dockerfile: Dockerfile.dev
      args:
        VANTAGE_VERSION: ${VANTAGE_VERSION:-dev}
    image: vantage-prime:dev
    container_name: vantage-prime-dev
    environment:
      OUTPOST_URL: http://outpost:8080
      GATE_URL:    http://gate:3000
      CHOKIDAR_USEPOLLING: "true"
    volumes:
      - ./prime:/app
      - /app/node_modules
    ports:
      - "${VANTAGE_DEV_PRIME_PORT:-5173}:5173"
    depends_on:
      - outpost
      - gate
    networks:
      - vantage-dev

networks:
  vantage-dev:
    name: vantage-dev

volumes:
  vantage-dev-go-mod:
  vantage-dev-go-cache:
  vantage-dev-gate-modules:
  vantage-dev-gate-data:
  vantage-dev-outpost-data:
