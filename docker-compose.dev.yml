name: vantage-dev

services:
  auth:
    build:
      context: ./gate
      dockerfile: Dockerfile.dev
      args:
        VANTAGE_VERSION: ${VANTAGE_VERSION:-dev}
    image: vantage-gate:dev
    container_name: vantage-gate-dev
    working_dir: /app
    environment:
      PORT: 3000
      AUTH_DB_PATH: /data/auth.db
      AUTH_BASE_PATH: /auth
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?BETTER_AUTH_SECRET must be set}
      # AES-256-GCM key for encrypting backend tokens in the server registry.
      # Generate once with `openssl rand -base64 32` and persist.
      VANTAGE_REGISTRY_KEY: ${VANTAGE_REGISTRY_KEY:?VANTAGE_REGISTRY_KEY must be set (openssl rand -base64 32)}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:-http://${VANTAGE_HOSTNAME:-localhost}:${VANTAGE_DEV_FRONTEND_PORT:-5173}}
      TRUSTED_ORIGINS: ${TRUSTED_ORIGINS:-http://localhost:${VANTAGE_DEV_FRONTEND_PORT:-5173},http://${VANTAGE_HOSTNAME:-localhost}:${VANTAGE_DEV_FRONTEND_PORT:-5173},http://${VANTAGE_LAN_IP:-127.0.0.1}:${VANTAGE_DEV_FRONTEND_PORT:-5173},http://localhost:${VANTAGE_PROD_PORT:-8088}}
      AUTH_RP_ID:     ${AUTH_RP_ID:-${VANTAGE_HOSTNAME:-localhost}}
      AUTH_RP_NAME:   ${AUTH_RP_NAME:-Vantage (dev)}
      GITHUB_CLIENT_ID:     ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
      GOOGLE_CLIENT_ID:     ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
    volumes:
      - ./auth:/app
      - vantage-dev-auth-modules:/app/node_modules
      - vantage-dev-auth-data:/data
    ports:
      - "${VANTAGE_DEV_AUTH_PORT:-3000}:3000"
    networks:
      - vantage-dev

  backend:
    build:
      context: ./outpost
      dockerfile: Dockerfile.dev
      args:
        VANTAGE_VERSION: ${VANTAGE_VERSION:-dev}
    image: vantage-backend:dev
    container_name: vantage-backend-dev
    working_dir: /app
    cap_add:
      - SYS_RAWIO
      - SYS_ADMIN
      - SYS_PTRACE
    security_opt:
      - apparmor=unconfined
    device_cgroup_rules:
      - 'b 8:* rwm'
      - 'b 259:* rwm'
    environment:
      HOST_PROC: /host/proc
      HOST_SYS:  /host/sys
      HOST_ETC:  /host/etc
      HOST_ROOT: /hostfs
      DBUS_SYSTEM_BUS_ADDRESS: unix:path=/run/dbus/system_bus_socket
      DOCKER_SOCK: /var/run/docker.sock
      VANTAGE_DATA_DIR: /data
      VANTAGE_ENCRYPTION_KEY: ${VANTAGE_ENCRYPTION_KEY:-}
      CLOUDFLARE_API_TOKEN: ${CLOUDFLARE_API_TOKEN:-}
      CLOUDFLARE_ACCOUNT_ID: ${CLOUDFLARE_ACCOUNT_ID:-}
      CLOUDFLARE_TUNNEL_ID: ${CLOUDFLARE_TUNNEL_ID:-}
    volumes:
      - ./backend:/app
      - vantage-dev-backend-data:/data
      - vantage-dev-go-mod:/go/pkg/mod
      - vantage-dev-go-cache:/root/.cache/go-build
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /etc/os-release:/host/etc/os-release:ro
      - /etc/localtime:/etc/localtime:ro
      - /etc/hostname:/host/etc/hostname:ro
      - /etc/machine-id:/host/etc/machine-id:ro
      - /etc/passwd:/host/etc/passwd:ro
      - /etc/group:/host/etc/group:ro
      - /var/run/docker.sock:/var/run/docker.sock
      - /run/dbus/system_bus_socket:/run/dbus/system_bus_socket
      - /run/systemd:/run/systemd:ro
      - /:/hostfs:ro,rslave
      - /dev:/dev
    ports:
      - "${VANTAGE_DEV_BACKEND_PORT:-8082}:8080"
    networks:
      - vantage-dev

  frontend:
    build:
      context: ./prime
      dockerfile: Dockerfile.dev
      args:
        VANTAGE_VERSION: ${VANTAGE_VERSION:-dev}
    image: vantage-prime:dev
    container_name: vantage-prime-dev
    environment:
      BACKEND_URL: http://backend:8080
      AUTH_URL:    http://auth:3000
      CHOKIDAR_USEPOLLING: "true"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "${VANTAGE_DEV_FRONTEND_PORT:-5173}:5173"
    depends_on:
      - backend
      - auth
    networks:
      - vantage-dev

networks:
  vantage-dev:
    name: vantage-dev

volumes:
  vantage-dev-go-mod:
  vantage-dev-go-cache:
  vantage-dev-auth-modules:
  vantage-dev-auth-data:
  vantage-dev-backend-data:
